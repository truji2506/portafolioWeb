name: portafolio_jose
description: "Portafolio de José Trujillo · Diseñador UI/UX y de experiencias interactivas"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  firebase_core: ^4.15.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Exporta las imágenes desde la página «Assets web» del Figma y cópialas aquí.
  assets:
    - assets/images/
    - assets/videos/
